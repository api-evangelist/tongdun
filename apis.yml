name: Tongdun
description: >-
  Tongdun (同盾科技 / Tongdun Technology) is a Hangzhou-based intelligent
  risk-control and anti-fraud analytics company whose public product presence
  now operates under the 小盾未来 (Xiaodun Future) brand at xiaodun.com. It uses
  AI and intelligent-analysis techniques to predict and score fraud and credit
  risk across consumer lending, banking, insurance, and e-commerce, delivering
  decisioning, anti-fraud, and risk-management capabilities to financial
  institutions, small-loan and consumer-finance lenders, auto finance, and
  internet businesses. Its risk-control services are consumed as enterprise
  interfaces (风控接口) provisioned behind account registration and sales
  onboarding; there is no public self-serve developer portal, OpenAPI, or SDK
  registry surface exposed at this time. This record was surfaced as a portfolio
  company of Qiming Venture Partners and enriched from the company's live public
  web presence.
